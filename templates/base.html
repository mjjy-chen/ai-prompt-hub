<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if title %}{{ title }} - {% endif %}{{ config.site.name }}</title>
    <meta name="description" content="{{ config.site.description }}">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="./" class="nav-logo">{{ config.site.name }}</a>
            <div class="nav-links">
                <a href="prompts/">提示词 <span class="nav-en">Prompts</span></a>
                <a href="agents/">人格设定 <span class="nav-en">Agents</span></a>
                <a href="#about">关于 <span class="nav-en">About</span></a>
            </div>
        </div>
    </nav>
    
    <main>
        {% block content %}{% endblock %}
    </main>
    
    <footer class="footer">
        <div class="footer-container">
            <p>&copy; {{ now.year if now else 2024 }} {{ config.site.name }} | {{ config.site.description }}</p>
            <p class="footer-en">AI Prompt Hub - Curated AI Prompts & Agent Personas</p>
        </div>
    </footer>
    
    <script src="js/main.js"></script>
</body>
</html>
